name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: checks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Type check
        run: mypy src/mlx_autoquant
      - name: Test
        run: pytest --cov=mlx_autoquant --cov-report=term-missing

  integration:
    name: integration (macOS, py3.12)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Convert and verify tiny model
        run: |
          output="$(mktemp -d)/mlx-model"
          mlx-autoquant hf-internal-testing/tiny-random-LlamaForCausalLM \
            --output "$output" --bits 8 --yes
          test -f "$output/autoquant-report.json"
          test -f "$output/model.safetensors"
      - name: Convert and verify small Qwen model
        run: |
          output="$(mktemp -d)/mlx-model"
          mlx-autoquant Qwen/Qwen2.5-0.5B-Instruct \
            --revision 7ae557604adf67be50417f59c2c2f167def9a775 \
            --output "$output" --bits 8 --yes
          test -f "$output/autoquant-report.json"
          test -f "$output/model.safetensors"
